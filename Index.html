<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Awakened — Book One</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #eee5d2;
      font-family: Georgia, "Times New Roman", serif;
    }

    .cover {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(
          circle at center,
          #30291d 0%,
          #17140f 35%,
          #090909 75%
        );
    }

    .book {
      width: 100%;
      max-width: 800px;
      padding: 50px 25px;
      border: 1px solid #5f4e30;
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.8),
        inset 0 0 40px rgba(0, 0, 0, 0.35);
    }

    .symbol {
      font-size: 58px;
      color: #c9a65a;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 82px);
      font-weight: normal;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 22px;
      color: #c4ad7b;
      font-size: clamp(18px, 4vw, 27px);
      letter-spacing: 3px;
      font-style: italic;
    }

    .line {
      width: 120px;
      height: 1px;
      margin: 35px auto;
      background: #a7894c;
    }

    .intro {
      max-width: 600px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.9;
      color: #d2c8b5;
    }

    .enter {
      display: inline-block;
      margin-top: 40px;
      padding: 16px 34px;
      border: 1px solid #c2a15b;
      color: #eee5d2;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: 0.3s;
    }

    .enter:hover {
      background: #c2a15b;
      color: #090909;
    }

    .copyright {
      margin-top: 45px;
      color: #746b5c;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="cover">

    <section class="book">

      <div class="symbol">✦</div>

      <h1>The Awakened</h1>

      <div class="subtitle">
        Book One: Before the Beginning
      </div>

      <div class="line"></div>

      <p class="intro">
        Before kingdoms rose, before history was written,
        and before humanity remembered where it came from,
        something ancient was waiting to awaken.
      </p>

      <a class="enter" href="novel.html">
        Enter the Book
      </a>

      <div class="copyright">
        © 2026 The Awakened
      </div>

    </section>

  </main>

</body>
</html>
