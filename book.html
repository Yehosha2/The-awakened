<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>THE AWAKENED — Book One</title>

<link rel="stylesheet" href="style.css">

<style>

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: #111;
  color: #eee;
  font-family: Georgia, "Times New Roman", serif;
}

/* =========================================
   READER
   ========================================= */

#reader {
  width: 100%;
  min-height: 100vh;
}

#reader .page {
  display: none;
  width: 100%;
  min-height: 100vh;
  box-sizing: border-box;
}

#reader .page.active {
  display: block;
}

/* =========================================
   COVER
   ========================================= */

#reader .cover {
  min-height: 100vh;

  display: none;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  padding: 40px 25px;

  box-sizing: border-box;
}

#reader .cover.active {
  display: flex;
}

.cover h1 {
  margin: 0 0 15px;

  font-size: clamp(
    2.5rem,
    9vw,
    5.5rem
  );

  letter-spacing: 6px;
}

.cover h2 {
  margin: 0;

  font-size: clamp(
    1rem,
    4vw,
    1.5rem
  );

  font-weight: normal;

  color: #ccc;

  letter-spacing: 2px;
}

/* =========================================
   CHAPTER PAGE
   ========================================= */

#reader .chapter-page {

  display: none;

  padding:
    50px
    25px
    130px;

  box-sizing: border-box;
}

#reader .chapter-page.active {
  display: block;
}

#reader .chapter-page > * {
  max-width: 850px;

  margin-left: auto;
  margin-right: auto;
}

/* =========================================
   LOADING
   ========================================= */

#status {

  text-align: center;

  padding: 40px 20px;

  color: #aaa;
}

/* =========================================
   ERROR
   ========================================= */

.error {

  max-width: 700px;

  margin: 80px auto;

  padding: 30px;

  text-align: center;

  border: 1px solid #333;

  border-radius: 12px;

  background: #181818;
}

.error h2 {
  margin-top: 0;
}

/* =========================================
   CONTROLS
   ========================================= */

.reader-controls {

  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  z-index: 1000;

  background: rgba(
    17,
    17,
    17,
    0.98
  );

  border-top: 1px solid #333;

  padding: 10px;
}

.controls-inner {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 15px;

  max-width: 900px;

  margin: 0 auto;
}

.controls-inner button {

  min-width: 110px;

  padding: 10px 18px;

  border: 1px solid #555;

  border-radius: 8px;

  background: #181818;

  color: #eee;

  font-family: inherit;

  font-size: 14px;

  cursor: pointer;
}

.controls-inner button:hover:not(:disabled) {

  background: #252525;

  border-color: #aaa;
}

.controls-inner button:disabled {

  opacity: 0.35;

  cursor: not-allowed;
}

#pageCounter {

  min-width: 80px;

  text-align: center;

  color: #ccc;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 14px;
}

/* =========================================
   PROGRESS
   ========================================= */

.progress-wrap {

  width: 100%;

  height: 3px;

  margin-top: 10px;

  background: #292929;

  overflow: hidden;
}

#progressBar {

  width: 0%;

  height: 100%;

  background: #eee;

  transition: width 0.25s ease;
}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

  .cover h1 {
    letter-spacing: 3px;
  }

  .cover h2 {
    letter-spacing: 1px;
  }

  #reader .chapter-page {

    padding:
      35px
      18px
      130px;
  }

  .controls-inner {
    gap: 8px;
  }

  .controls-inner button {

    min-width: 90px;

    padding:
      9px
      12px;

    font-size: 12px;
  }

  #pageCounter {

    min-width: 60px;

    font-size: 12px;
  }

}

</style>

</head>


<body>

<main id="reader">

  <!-- =====================================
       COVER
       ===================================== -->

  <section
    class="page cover active"
    id="cover"
  >

    <h1>
      THE AWAKENED
    </h1>

    <h2>
      Book One — Before the Beginning
    </h2>

  </section>

  <!-- Loading -->

  <div id="status">
    Loading the book...
  </div>

</main>


<!-- =======================================
     CONTROLS
     ======================================= -->

<div class="reader-controls">

  <div class="controls-inner">

    <button
      type="button"
      id="previousButton"
    >
      PREVIOUS
    </button>

    <div id="pageCounter">
      1 / 1
    </div>

    <button
      type="button"
      id="nextButton"
    >
      NEXT
    </button>

  </div>

  <div class="progress-wrap">

    <div id="progressBar"></div>

  </div>

</div>


<script>

/* =========================================
   THE AWAKENED READER
   =========================================

   Cover = Page 1

   Chapters are loaded from:

   chapters/chapter-01.html
   chapters/chapter-02.html
   chapters/chapter-03.html

   etc.

   Missing chapter numbers are ignored.
   ========================================= */


let pages = [];

let currentPage = 0;


/* =========================================
   LOAD CHAPTERS
   ========================================= */

async function loadChapters() {

  const reader =
    document.getElementById("reader");

  const status =
    document.getElementById("status");

  const cover =
    document.getElementById("cover");


  /*
    Start fresh.
  */

  pages = [];


  /*
    Add cover first.
  */

  if (cover) {

    pages.push(cover);

  }


  /*
    Load chapters 01 through 39.
  */

  for (
    let number = 1;
    number <= 99;
    number++
  ) {

    const chapterNumber =
      String(number).padStart(2, "0");


    const path =
      `chapters/chapter-${chapterNumber}.html`;


    try {

      const response =
        await fetch(
          path,
          {
            cache: "no-cache"
          }
        );


      /*
        File doesn't exist.
      */

      if (!response.ok) {

        console.log(
          `Skipping ${path}`
        );

        continue;

      }


      const html =
        await response.text();


      if (!html.trim()) {

        continue;

      }


      /*
        Parse the chapter.
      */

      const parser =
        new DOMParser();


      const doc =
        parser.parseFromString(
          html,
          "text/html"
        );


      /*
        First try the expected
        section.page structure.
      */

      let content =
        doc.querySelector(
          "section.page"
        );


      /*
        If there isn't a section.page,
        use the body instead.

        This makes the reader compatible
        with more chapter file structures.
      */

      if (!content) {

        content = doc.body;

      }


      if (
        !content ||
        !content.innerHTML.trim()
      ) {

        console.log(
          `Empty chapter: ${path}`
        );

        continue;

      }


      /*
        Create reader page.
      */

      const page =
        document.createElement(
          "section"
        );


      page.className =
        "page chapter-page";


      /*
        Copy chapter content.
      */

      page.innerHTML =
        content.innerHTML;


      /*
        Store chapter number.
      */

      page.dataset.chapter =
        number;


      /*
        Add page to reader.
      */

      reader.appendChild(page);

      pages.push(page);


      console.log(
        `Loaded ${path}`
      );

    }

    catch (error) {

      console.error(
        `Error loading ${path}`,
        error
      );

    }

  }


  /*
    Remove loading message.
  */

  if (status) {

    status.remove();

  }


  /*
    If no chapters loaded,
    show diagnostic page.
  */

  if (pages.length === 1) {

    const errorPage =
      document.createElement(
        "section"
      );


    errorPage.className =
      "page error";


    errorPage.innerHTML = `

      <h2>
        THE AWAKENED
      </h2>

      <p>
        The cover loaded, but no chapters
        could be loaded.
      </p>

      <p>
        Your files need to be located here:
      </p>

      <p>
        <strong>
          chapters/chapter-01.html
        </strong>
      </p>

      <p>
        Then:
      </p>

      <p>
        <strong>
          chapters/chapter-02.html
        </strong>
      </p>

      <p>
        <strong>
          chapters/chapter-03.html
        </strong>
      </p>

      <p>
        and so on.
      </p>

      <p>
        Open the browser console to see
        which files were found.
      </p>

    `;


    reader.appendChild(
      errorPage
    );


    pages.push(
      errorPage
    );

  }


  /*
    Begin on cover.
  */

  currentPage = 0;

  updateReader();

}


/* =========================================
   UPDATE READER
   ========================================= */

function updateReader() {

  if (!pages.length) {

    return;

  }


  /*
    Show only current page.
  */

  pages.forEach(
    function(page, index) {

      if (
        index === currentPage
      ) {

        page.classList.add(
          "active"
        );

      }
      else {

        page.classList.remove(
          "active"
        );

      }

    }
  );


  const total =
    pages.length;


  /*
    Counter.
  */

  const counter =
    document.getElementById(
      "pageCounter"
    );


  if (counter) {

    counter.textContent =
      `${currentPage + 1} / ${total}`;

  }


  /*
    Previous.
  */

  const previous =
    document.getElementById(
      "previousButton"
    );


  if (previous) {

    previous.disabled =
      currentPage === 0;

  }


  /*
    Next.
  */

  const next =
    document.getElementById(
      "nextButton"
    );


  if (next) {

    next.disabled =
      currentPage >= total - 1;

  }


  /*
    Progress.
  */

  const progress =
    document.getElementById(
      "progressBar"
    );


  if (progress) {

    let percent = 0;


    if (total > 1) {

      percent =
        (
          currentPage /
          (total - 1)
        ) * 100;

    }


    progress.style.width =
      `${percent}%`;

  }


  /*
    Scroll to top.
  */

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================
   NEXT
   ========================================= */

function nextPage() {

  if (
    currentPage <
    pages.length - 1
  ) {

    currentPage++;

    updateReader();

  }

}


/* =========================================
   PREVIOUS
   ========================================= */

function previousPage() {

  if (
    currentPage > 0
  ) {

    currentPage--;

    updateReader();

  }

}


/* =========================================
   BUTTON EVENTS
   ========================================= */

document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    nextPage
  );


document
  .getElementById("previousButton")
  .addEventListener(
    "click",
    previousPage
  );


/* =========================================
   KEYBOARD
   ========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowRight"
    ) {

      nextPage();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      previousPage();

    }

  }
);


/* =========================================
   START READER
   ========================================= */

loadChapters();

</script>

</body>

</html>
