<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>THE AWAKENED — Book One</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Georgia, "Times New Roman", serif;
    }

    .reader {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .page {
      display: none;
      min-height: 100vh;
      padding: 60px 30px 100px;
      line-height: 1.8;
    }

    .page.active {
      display: block;
    }

    .chapter-number {
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-size: 14px;
      opacity: 0.7;
    }

    h1,
    h2,
    h3 {
      text-align: center;
    }

    .divider {
      text-align: center;
      margin: 40px 0;
    }

    .toc-section-title {
      text-align: center;
      margin: 30px 0;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .toc-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #292929;
      font-size: 14px;
    }

    .toc-line span:last-child {
      text-align: right;
      opacity: 0.75;
    }

    .loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

    .error {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
    }

    .error h2 {
      color: #fff;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.94);
      border-top: 1px solid #333;
      z-index: 1000;
    }

    button {
      padding: 10px 18px;
      border: 1px solid #777;
      border-radius: 6px;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
    }

    button:hover {
      background: #333;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #pageCounter {
      min-width: 130px;
      text-align: center;
      font-size: 13px;
    }

    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #333;
      z-index: 1001;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.2s ease;
    }

    @media (max-width: 600px) {

      .page {
        padding: 45px 18px 100px;
      }

      .toc-line {
        flex-direction: column;
        gap: 3px;
      }

      .toc-line span:last-child {
        text-align: left;
      }

      .controls {
        gap: 6px;
        padding: 8px 5px;
      }

      button {
        padding: 9px 11px;
        font-size: 12px;
      }

      #pageCounter {
        min-width: 90px;
        font-size: 11px;
      }

    }

  </style>

</head>


<body>


  <div class="progress-container">

    <div id="progressBar"></div>

  </div>


  <main
    id="reader"
    class="reader"
  >

    <div
      id="status"
      class="loading"
    >

      Loading THE AWAKENED…

    </div>

  </main>


  <div class="controls">

    <button
      id="previousButton"
      type="button"
      onclick="previousPage()"
    >
      ← PREVIOUS
    </button>


    <span id="pageCounter">
      Loading…
    </span>


    <button
      id="nextButton"
      type="button"
      onclick="nextPage()"
    >
      NEXT →
    </button>


    <button
      id="readButton"
      type="button"
      onclick="toggleReading()"
    >
      🔊 READ
    </button>

  </div>


  <script>

    /*
    ==================================================
    THE AWAKENED
    BOOK ONE — BEFORE THE BEGINNING

    Standalone Reader

    This file does NOT depend on app.js.
    ==================================================
    */


    let pages = [];

    let currentPage = 0;


    /*
    ==================================================
    CHAPTER LIST
    ==================================================
    */

    const chapters = [

      ["Chapter One", "THE TABLET"],

      ["Chapter Two", "THE PROFESSOR"],

      ["Chapter Three", "THE HIDDEN LANGUAGE"],

      ["Chapter Four", "THE FATHER'S NOTEBOOK"],

      ["Chapter Five", "JERICHO"],

      ["Chapter Six", "THE WATCHERS"],

      ["Chapter Seven", "THE VOICE"],

      ["Chapter Eight", "MAYA"],

      ["Chapter Nine", "THE MAN IN THE DARK"],

      ["Chapter Ten", "THE MAN WHO RETURNED"],

      ["Chapter Eleven", "THE CITY THAT REMEMBERED"],

      [
        "Chapter Twelve",
        "SEEK AND FIND, KNOCK AND THE DOOR WILL BE OPENED"
      ],

      ["Chapter Thirteen", "ONE WHO REMEMBERED"],

      ["Chapter Fourteen", "THE VOICE"],

      ["Chapter Fifteen", "THE EYES IN THE DARK"],

      ["Chapter Sixteen", "THE MONSTER WITHIN"],

      ["Chapter Seventeen", "THE AWAKENING"],

      ["Chapter Eighteen", "THE CITY RISES"],

      ["Chapter Nineteen", "THE FALL"],

      ["Chapter Twenty", "BEFORE MAYA"],

      ["Chapter Twenty-One", "THE BETRAYAL"],

      ["Chapter Twenty-Two", "THE HUNGER BELOW"],

      ["Chapter Twenty-Three", "THE SHOMRIM"],

      ["Chapter Twenty-Four", "THE FIRST NAME"],

      ["Chapter Twenty-Five", "THE ONE WHO WAITED"],

      ["Chapter Twenty-Six", "THE AWAKENING"],

      ["Chapter Twenty-Seven", "THE REVELATION"],

      ["Chapter Twenty-Eight", "THE SKY REMEMBERS"],

      ["Chapter Twenty-Nine", "THE LAST KEEPER"],

      ["Chapter Thirty", "EARTH STOOD STILL"],

      ["Chapter Thirty-One", "THE QUIET BETWEEN"],

      ["Chapter Thirty-Two", "THE VOICE BENEATH THE WATER"],

      ["Chapter Thirty-Three", "THE MOTHER'S SECRET"],

      ["Chapter Thirty-Four", "MAYA, MAYA"],

      ["Chapter Thirty-Five", "THE FIRST MEMORY"],

      ["Chapter Thirty-Six", "THE NAME BEFORE NAMES"],

      ["Chapter Thirty-Seven", "AWAKE"],

      ["Chapter Thirty-Eight", "THE DIFFERENCE"],

      ["Chapter Thirty-Nine", "THE KEY"]

    ];


    /*
    ==================================================
    CREATE TABLE OF CONTENTS
    ==================================================
    */

    function createTOCPage(
      entries,
      title
    ) {

      const page =
        document.createElement("section");

      page.className = "page toc";


      let html = `

        <div class="chapter-number">
          THE AWAKENED
        </div>

        <h2>
          TABLE OF CONTENTS
        </h2>

        <div class="toc-section-title">
          ${title}
        </div>

      `;


      entries.forEach(
        function(item) {

          html += `

            <div class="toc-line">

              <span>
                ${item[0]}
              </span>

              <span>
                ${item[1]}
              </span>

            </div>

          `;

        }
      );


      page.innerHTML = html;

      return page;

    }


    /*
    ==================================================
    LOAD CHAPTER
    ==================================================
    */

    async function loadChapter(
      number
    ) {

      const padded =
        String(number).padStart(
          2,
          "0"
        );


      const path =
        `./chapters/chapter-${padded}.html`;


      try {

        const response =
          await fetch(
            `${path}?v=${Date.now()}`,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          console.warn(
            "Chapter unavailable:",
            path,
            response.status
          );

          return null;

        }


        const html =
          await response.text();


        const parser =
          new DOMParser();


        const doc =
          parser.parseFromString(
            html,
            "text/html"
          );


        const chapterPage =
          doc.querySelector(
            ".page"
          );


        if (!chapterPage) {

          console.warn(
            "No .page found in:",
            path
          );

          return null;

        }


        return document.importNode(
          chapterPage,
          true
        );

      } catch (error) {

        console.error(
          "Failed to load:",
          path,
          error
        );

        return null;

      }

    }


    /*
    ==================================================
    LOAD THE ENTIRE BOOK
    ==================================================
    */

    async function loadBook() {

      const reader =
        document.getElementById(
          "reader"
        );


      if (!reader) {
        return;
      }


      reader.innerHTML = "";


      /*
      TABLE OF CONTENTS PAGE 1
      */

      reader.appendChild(
        createTOCPage(
          chapters.slice(0, 13),
          "Chapters One — Thirteen"
        )
      );


      /*
      TABLE OF CONTENTS PAGE 2
      */

      reader.appendChild(
        createTOCPage(
          chapters.slice(13, 27),
          "Chapters Fourteen — Twenty-Seven"
        )
      );


      /*
      TABLE OF CONTENTS PAGE 3
      */

      reader.appendChild(
        createTOCPage(
          chapters.slice(27, 39),
          "Chapters Twenty-Eight — Thirty-Nine"
        )
      );


      /*
      LOAD CHAPTERS 1–39
      */

      for (
        let number = 1;
        number <= 39;
        number++
      ) {

        const page =
          await loadChapter(
            number
          );


        /*
        Missing files are skipped.

        This means the Reader will still work
        if GitHub Pages has not received Chapter 38 yet.
        */

        if (page) {

          reader.appendChild(
            page
          );

        }

      }


      /*
      FIND ALL PAGES
      */

      pages =
        Array.from(
          reader.querySelectorAll(
            ".page"
          )
        );


      /*
      NOTHING LOADED
      */

      if (!pages.length) {

        reader.innerHTML = `

          <section class="page active">

            <div class="error">

              <h2>
                THE AWAKENED
              </h2>

              <p>
                The Reader could not load the
                chapter files.
              </p>

              <p>
                Please check the chapters folder
                in the repository.
              </p>

            </div>

          </section>

        `;


        pages =
          Array.from(
            reader.querySelectorAll(
              ".page"
            )
          );


        currentPage = 0;

        updateReader();

        return;

      }


      /*
      START AT TABLE OF CONTENTS
      */

      currentPage = 0;

      showPage(
        0
      );

    }


    /*
    ==================================================
    SHOW PAGE
    ==================================================
    */

    function showPage(
      pageNumber
    ) {

      if (!pages.length) {
        return;
      }


      if (
        pageNumber < 0
      ) {

        pageNumber = 0;

      }


      if (
        pageNumber >= pages.length
      ) {

        pageNumber =
          pages.length - 1;

      }


      pages.forEach(
        function(
          page,
          index
        ) {

          page.classList.toggle(
            "active",
            index === pageNumber
          );

        }
      );


      currentPage =
        pageNumber;


      updateReader();


      window.scrollTo(
        {
          top: 0,
          behavior: "smooth"
        }
      );

    }


    /*
    ==================================================
    UPDATE CONTROLS
    ==================================================
    */

    function updateReader() {

      const counter =
        document.getElementById(
          "pageCounter"
        );


      const previous =
        document.getElementById(
          "previousButton"
        );


      const next =
        document.getElementById(
          "nextButton"
        );


      const progress =
        document.getElementById(
          "progressBar"
        );


      if (counter) {

        counter.textContent =
          `Page ${currentPage + 1} of ${pages.length}`;

      }


      if (previous) {

        previous.disabled =
          currentPage === 0;

      }


      if (next) {

        next.disabled =
          currentPage >=
          pages.length - 1;

      }


      if (progress) {

        const percent =
          pages.length <= 1
            ? 0
            : (
                (currentPage + 1)
                /
                pages.length
              ) * 100;


        progress.style.width =
          `${percent}%`;

      }

    }


    /*
    ==================================================
    NEXT
    ==================================================
    */

    function nextPage() {

      if (
        currentPage <
        pages.length - 1
      ) {

        stopReading();

        showPage(
          currentPage + 1
        );

      }

    }


    /*
    ==================================================
    PREVIOUS
    ==================================================
    */

    function previousPage() {

      if (
        currentPage > 0
      ) {

        stopReading();

        showPage(
          currentPage - 1
        );

      }

    }


    /*
    ==================================================
    TEXT TO SPEECH
    ==================================================
    */

    function getPageText(
      page
    ) {

      const clone =
        page.cloneNode(
          true
        );


      clone
        .querySelectorAll(
          ".chapter-number, .divider"
        )
        .forEach(
          function(element) {

            element.remove();

          }
        );


      return (
        clone.innerText ||
        clone.textContent ||
        ""
      )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    /*
    ==================================================
    READ CURRENT PAGE
    ==================================================
    */

    function readCurrentPage() {

      if (
        !(
          "speechSynthesis"
          in
          window
        )
      ) {

        alert(
          "Text-to-speech is not supported on this device."
        );

        return;

      }


      if (!pages.length) {
        return;
      }


      window.speechSynthesis.cancel();


      const text =
        getPageText(
          pages[currentPage]
        );


      if (!text) {
        return;
      }


      const speech =
        new SpeechSynthesisUtterance(
          text
        );


      speech.rate = 0.9;

      speech.pitch = 1;

      speech.volume = 1;


      const button =
        document.getElementById(
          "readButton"
        );


      speech.onstart =
        function() {

          if (button) {

            button.textContent =
              "⏸ PAUSE";

          }

        };


      speech.onend =
        function() {

          if (button) {

            button.textContent =
              "🔊 READ";

          }

        };


      speech.onerror =
        function() {

          if (button) {

            button.textContent =
              "🔊 READ";

          }

        };


      window.speechSynthesis.speak(
        speech
      );

    }


    /*
    ==================================================
    READ / PAUSE / RESUME
    ==================================================
    */

    function toggleReading() {

      if (
        !(
          "speechSynthesis"
          in
          window
        )
      ) {

        alert(
          "Text-to-speech is not supported."
        );

        return;

      }


      const button =
        document.getElementById(
          "readButton"
        );


      if (
        window.speechSynthesis.speaking
      ) {

        if (
          window.speechSynthesis.paused
        ) {

          window.speechSynthesis.resume();


          if (button) {

            button.textContent =
              "⏸ PAUSE";

          }

        } else {

          window.speechSynthesis.pause();


          if (button) {

            button.textContent =
              "▶️ RESUME";

          }

        }

      } else {

        readCurrentPage();

      }

    }


    /*
    ==================================================
    STOP READING
    ==================================================
    */

    function stopReading() {

      if (
        "speechSynthesis"
        in
        window
      ) {

        window.speechSynthesis.cancel();

      }


      const button =
        document.getElementById(
          "readButton"
        );


      if (button) {

        button.textContent =
          "🔊 READ";

      }

    }


    /*
    ==================================================
    KEYBOARD CONTROLS
    ==================================================
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "ArrowRight"
        ) {

          nextPage();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          previousPage();

        }

      }
    );


    /*
    ==================================================
    START
    ==================================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadBook();

      }
    );

  </script>


</body>

</html>
