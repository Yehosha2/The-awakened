<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>THE AWAKENED — Book One</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Georgia, "Times New Roman", serif;
    }

    .reader {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .page {
      display: none;
      min-height: 100vh;
      padding: 60px 30px 100px;
      line-height: 1.8;
    }

    .page.active {
      display: block;
    }

    .chapter-number {
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-size: 14px;
      opacity: 0.7;
    }

    h1,
    h2 {
      text-align: center;
    }

    .divider {
      text-align: center;
      margin: 40px 0;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
    }

    button {
      padding: 10px 18px;
      border: 1px solid #777;
      border-radius: 6px;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #pageCounter {
      min-width: 110px;
      text-align: center;
      font-size: 13px;
    }

    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #333;
      z-index: 1001;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.2s ease;
    }

    #status {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="progress-container">
    <div id="progressBar"></div>
  </div>

  <main id="reader" class="reader">

    <div id="status">
      Loading THE AWAKENED…
    </div>

  </main>

  <div class="controls">

    <button id="previousButton" onclick="previousPage()">
      ← PREVIOUS
    </button>

    <span id="pageCounter">
      Loading…
    </span>

    <button id="nextButton" onclick="nextPage()">
      NEXT →
    </button>

    <button id="readButton" onclick="toggleReading()">
      🔊 READ
    </button>

  </div>

  <script src="app.js"></script>

</body>
</html>
