<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>THE AWAKENED — Episodes</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================
       THE AWAKENED — EPISODES
       ========================================= */

    .episodes-page {
      min-height: 100vh;
      padding: 40px 20px 70px;
    }

    .episodes-header {
      max-width: 1000px;
      margin: 0 auto 45px;
      text-align: center;
    }

    .episodes-eye {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .episodes-header h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 58px);
      letter-spacing: 0.08em;
    }

    .episodes-header h2 {
      margin: 10px 0;
      font-size: clamp(20px, 4vw, 30px);
      letter-spacing: 0.2em;
    }

    .episodes-header p {
      margin-top: 15px;
      opacity: 0.7;
      letter-spacing: 0.12em;
    }


    /* =========================================
       EPISODE GRID
       ========================================= */

    .episodes-grid {

      width: 100%;
      max-width: 1100px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(270px, 1fr));

      gap: 24px;

    }


    /* =========================================
       EPISODE CARD
       ========================================= */

    .episode-card {

      overflow: hidden;

      border-radius: 18px;

      border: 1px solid rgba(255,255,255,0.12);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.08),
          rgba(0,0,0,0.35)
        );

      box-shadow:
        0 15px 40px rgba(0,0,0,0.30);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease;

    }

    .episode-card:hover {

      transform: translateY(-5px);

      border-color:
        rgba(255,255,255,0.35);

    }


    /* =========================================
       ARTWORK AREA
       ========================================= */

    .episode-art {

      position: relative;

      height: 190px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background:

        radial-gradient(
          circle at center,
          rgba(255,255,255,0.12),
          transparent 45%
        ),

        linear-gradient(
          135deg,
          #191919,
          #050505
        );

    }

    .episode-art::after {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.65),
          transparent 60%
        );

      pointer-events: none;

    }

    .episode-eye {

      position: relative;

      z-index: 2;

      font-size: 58px;

      opacity: 0.9;

      filter:
        drop-shadow(
          0 0 20px rgba(255,255,255,0.18)
        );

    }


    /* =========================================
       EPISODE INFORMATION
       ========================================= */

    .episode-info {

      padding: 22px;

    }

    .episode-number {

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 0.18em;

      opacity: 0.65;

    }

    .episode-title {

      margin: 8px 0 20px;

      font-size: 23px;

      line-height: 1.25;

    }


    /* =========================================
       READ BUTTON
       ========================================= */

    .episode-read {

      display: inline-block;

      padding: 10px 18px;

      border-radius: 999px;

      border: 1px solid rgba(255,255,255,0.3);

      text-decoration: none;

      color: inherit;

      font-size: 13px;

      font-weight: bold;

      letter-spacing: 0.08em;

      transition:
        background 0.2s ease,
        color 0.2s ease;

    }

    .episode-read:hover {

      background: white;

      color: black;

    }


    /* =========================================
       BACK BUTTON
       ========================================= */

    .episodes-footer {

      text-align: center;

      margin-top: 50px;

    }

    .back-home {

      display: inline-block;

      padding: 11px 20px;

      border: 1px solid rgba(255,255,255,0.2);

      border-radius: 999px;

      text-decoration: none;

      color: inherit;

      font-size: 13px;

    }

    .back-home:hover {

      border-color: white;

    }

  </style>

</head>


<body>


  <main class="episodes-page">


    <!-- =====================================
         HEADER
         ====================================== -->

    <header class="episodes-header">

      <div class="episodes-eye">
        👁️
      </div>

      <h1>
        THE AWAKENED
      </h1>

      <h2>
        EPISODES
      </h2>

      <p>
        THE JOURNEY BEHIND THE STORY
      </p>

    </header>


    <!-- =====================================
         EPISODE CARDS
         CREATED BY episodes.js
         ====================================== -->

    <section
      id="episodes-grid"
      class="episodes-grid"
      aria-label="The Awakened Episodes"
    ></section>


    <!-- =====================================
         BACK HOME
         ====================================== -->

    <footer class="episodes-footer">

      <a
        href="index.html"
        class="back-home"
      >
        ← BACK TO THE AWAKENED
      </a>

    </footer>


  </main>


  <script src="episodes.js"></script>

</body>

</html>
